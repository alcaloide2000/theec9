# English with Kyle

## Grammar Rules

### Comparisons & Degree

#### as…as Structures *(Apr 28)*
- [→ Go to class](/?class=kyle_20260428)
- **not quite as…as** → small gap, almost equal *(casi igual)*
- **not nearly as…as** → large gap, clearly less *(con mucha diferencia)*
- **just about as…as** → barely reaches, almost equal *(casi)*

#### just about to *(Apr 28)*
- [→ Go to class](/?class=kyle_20260428)
- On the verge of doing something *(a punto de)*
- *I was just about to call you when you rang*
- Different from *just about as* — same words, different meaning

#### Way as Amplifier *(May 26)*
- [→ Go to class](/?class=kyle_20260526)
- **way** + comparative → *way better, way bigger, way smarter*
- **way more / way less** — never ~~way many~~
- **way too** + adjective → *way too far, way too hot*

#### Quantity Comparisons *(May 5 & Jun 2)*
- [→ Go to class](/?class=kyle_20260505)
- [→ Go to class](/?class=kyle_20260602)
- **fewer** → countable · **less** → uncountable
- **not as many** → countable *(fewer ↔ not as many)*
- **not as much** → uncountable *(less ↔ not as much)*
- Pattern: *There are not as many cars in Palencia as there are in Valencia*
- When using *as*, use it **twice** — once before noun, once before comparison

### Question Tags *(Apr 28)*
- [→ Go to class](/?class=kyle_20260428)
- Flip the auxiliary (positive ↔ negative), repeat pronoun
- *He likes fish, **doesn't he?*** · *They can't fix it, **can they?***
- Verb *to be* acts as its own auxiliary → *It is cold, **isn't it?***

### Negative Shift *(May 21 & Jun 2)*
- [→ Go to class](/?class=kyle_20260521)
- [→ Go to class](/?class=kyle_20260602)
- *Creo que no…* → negate **think**, not the clause
- ✓ *I don't think they heard* · ✗ ~~I think they didn't hear~~
- ✓ *I don't think I can go* · ✗ ~~I think I can't go~~
- **to make it** → poder asistir / llegar a tiempo

### Past Continuous *(May 12)*
- [→ Go to class](/?class=kyle_20260512)
- **was/were + -ing** → action in progress being interrupted
- *What were you doing when you saw them?*
- **by the time** *(para cuando)* → *By the time I arrived, it was over*

### Let vs Allow *(May 21)*
- [→ Go to class](/?class=kyle_20260521)
- **let** + bare infinitive → *Let me explain* (no *to*)
- **allow** + to + infinitive → *Allow me to do it*
- **let** is more informal; **allow** is slightly formal

### Used to Structures *(May 21 & 26)*
- [→ Go to class](/?class=kyle_20260521)
- [→ Go to class](/?class=kyle_20260526)
- **used to** + infinitive → past habit, no longer true *(I used to play tennis)*
- **be used to** + -ing/noun → already accustomed *(I'm used to the rain)*
- **get used to** + -ing/noun → still adapting *(I can't get used to the heat)*

### Raise vs Rise *(May 5)*
- [→ Go to class](/?class=kyle_20260505)
- **Raise** → transitive, needs object: *I raise my hand → the government raises taxes*
- **Rise** → intransitive, no object: *My hand rises → taxes rise*

### Can vs To Be Able To *(May 28)*
- [→ Go to class](/?class=kyle_20260528)
- **can** → present · **could** → past
- Future: **will be able to** *(will can ❌ does not exist)*
- *Will you be able to come tomorrow?* · *Why won't he be able to do it?*

### Adjective Formation *(May 21)*
- [→ Go to class](/?class=kyle_20260521)
- Noun + **-y** → watery, rainy, spicy, smoky, juicy, earthy, fruity, windy
- Compound + **hyphen** → tight-fisted, left-handed, narrow-minded, five-year-old
- No plural inside compound adj → *a ten-minute break* ✓ · ~~a ten-minutes break~~ ✗
- **The** + nationality adj = whole group, no plural → *The Scottish, The Chinese, The Spanish*

### Another · Other · The Other *(Jun 2)*
- [→ Go to class](/?class=kyle_20260602)
- **another** *(sing.)* = one more / one additional → *Would you like another beer?*
- **other** *(pl.)* = plural of *another* → *Other opportunities will come*
- **the other** / **the other ones** = el otro / los otros *(specific)* → *Give me the other book*
- *Dame otro* → **another** · *Dame el otro* → **the other** · *Dame los otros* → **the other ones**

### Present Perfect: I've Never *(Jun 2)*
- [→ Go to class](/?class=kyle_20260602)
- Pattern: *When did you last [inf]…?* → *I have never [past participle]…*
- *When did you last win?* → *I've never **won**.*
- *When did you last write?* → *I've never **written**.*
- *When did you last catch a train?* → *I've never **caught** a train.*
- *When did you last deal with X?* → *I've never **dealt** with X.*
- *When did you last* uses infinitive · *When was the last time you* uses simple past

### Intensifiers: So / Such *(May 19)*
- [→ Go to class](/?class=kyle_20260519)
- **so** + adjective → *His nose is so big (that you can see it from space)*
- **such a/an** + adjective + noun → *He has such a big nose (that everyone notices)*
- ✓ *It was such a long meeting* · ✗ ~~It was so a long meeting~~

### Too vs Very *(May 19)*
- [→ Go to class](/?class=kyle_20260519)
- **very** → mucho, neutral intensifier — *He is very busy*
- **too** → demasiado, excessive / implies a problem — *He's too busy to answer*
- *He's too busy getting rich* → sounds like a complaint, not just description

### Would you mind + -ing *(May 19)*
- [→ Go to class](/?class=kyle_20260519)
- Always followed by the **gerund (-ing)** form — never the infinitive
- *Would you mind **picking up** your shoes?* *(¿Te importaría recoger tus zapatos?)*
- *Would you mind **closing** the door?*

### Famous for / Well-known for / Reputation for *(May 21)*
- [→ Go to class](/?class=kyle_20260521)
- All take **for** + gerund or noun — ⚠ never **of**
- *They're **famous for** being stingy*
- *They're **well-known for** being tight-fisted*
- *They **have a reputation for** being stingy*
- *Ávila is **famous for** its walls*

### Suggestions: How About / Shall / Let's *(Jun 9)*
- [→ Go to class](/?class=kyle_20260609)
- **How about** + *-ing* → *How about going to the cinema?*
- **How about** + subject + infinitive → *How about we go to the cinema?*
- **Shall I / Shall we** + infinitive → *Shall we go? · Shall I open the window?*
- ⚠ **Shall** = first person only (I / we) — never second or third
- **Let's** + infinitive → affirmative suggestion *(not interrogative)* → *Let's go!*
- All equivalent: *How about going / How about we go / Shall we go / Let's go / Do you feel like going*

### I Wish / If Only *(Jun 9)*
- [→ Go to class](/?class=kyle_20260609)
- **I wish** + *were* (subjunctive, not *was*) → *I wish everything **were** automated*
- **If only** + *were* → same meaning, more poetic → *If only everything were automated*
- ⚠ Never: ~~I wish everything **was** automated~~

### Irregular Verbs — Simple Past *(Jun 2)*
- [→ Go to class](/?class=kyle_20260602)
- send → **sent** · sit → **sat** · sleep → **slept** · speak → **spoke**
- spend → **spent** · stand → **stood** · steal → **stole** · take → **took**
- teach → **taught** *(t-a-u-g-h-t = /tɔːt/)* · tell → **told** · think → **thought**
- throw → **threw** · understand → **understood** · wear → **wore** · win → **won**
- write → **wrote** · become → **became** · begin → **began** · break → **broke** · build → **built**

### Preposition "to" with Nouns *(May 28)*
- [→ Go to class](/?class=kyle_20260528)
- Open the book **to** page 40 *(not "on" page 40)*
- The lyrics **to** the song *(far more natural than "of")*

### Uses of ONE *(Jun 11)*
- [→ Go to class](/?class=kyle_20260611)
- *el/la que* → **the one** · *los/las que* → **the ones**
- *El que está en la mesa es de ellos* → The one on the table is theirs
- *El tuyo es el que rechazamos* → Yours is **the one** we rejected
- *¿Cuál quieres? ¿El de la mesa o el de la silla?* → Which one do you want? The one on the table or the one on the chair?
- **Possessive pronouns stand alone** — never use "the" before them: ~~the mine~~ ✗ → **mine** ✓
- *mine / yours / his / hers / ours / theirs* — no change for singular or plural: *mine is · mine are*
- **these / those** — "ones" optional: *these and those are mine* (shorter form preferred)

### Supposed to — Three Uses *(Jun 11)*
- [→ Go to class](/?class=kyle_20260611)
- **1 — Obligation:** *You're supposed to wear a tie · Am I supposed to bring anything?*
- **2 — Past unfulfilled expectation:** *Was I supposed to call you? · She was supposed to be here at 9*
- **3 — Reputation / "people say that":** *He's supposed to be great at telling jokes · Isn't this movie supposed to be scary?*
- Spanish: *se supone que · se dice que*

### Passive Voice *(Jun 16)*
- [→ Go to class](/?class=kyle_20260616)
- Not a change of tense — a change of **voice** (same info, different angle)
- Structure: **to be** (in the correct tense) + **past participle** (3rd form)
- The verb *to be* carries the tense; the main verb stays as past participle
- When to use: emphasise a subject / de-emphasise the agent (*You're fired* ≠ *I am firing you*)

#### Tense table
- Present continuous → *is being beaten*
- Simple past → *was beaten*
- Future → *will be beaten*
- Present perfect → *has / have been + pp*
- Past perfect → *had been + pp*
- Going to → *is going to be + pp*

#### Practice (active → passive)
- *Someone handed me a note* → **I was handed a note**
- *She was offered a secondhand bicycle*
- *Improvements have been proposed to the developers*
- *The password had been mentioned to the thieves* *(past perfect)*
- *I have been lent some skis* *(present perfect)*
- *A lot of spam emails are being sent to me* *(present continuous)*
- *The changes are going to be explained to the students*

### Tense Logic — Present Perfect vs Simple Past *(Jun 16)*
- [→ Go to class](/?class=kyle_20260616)
- **Present perfect** = ongoing relevance to now; no specific past point named
- **Simple past** = specific, isolated moment in the past
- *I've been here for a month* (for + period → PP) · *I joined on my first day* (specific point → SP)
- *I've just ordered furniture* (**just** = acabar de → PP) · *I bought paint two weeks ago* (**ago** → SP)
- *I haven't done much yet* (**yet** in negatives/questions → PP)
- *I've been almost every day since then* (**since** → PP)
- Switch rule: once a specific past moment is named, switch to simple past even mid-paragraph

## Time Expressions

### Prepositions: In / On / At *(May 19)*
- [→ Go to class](/?class=kyle_20260519)
- **in** → months, seasons, years *(in June · in summer · in 2020)*
- **on** → days, specific dates *(on Monday · on the 23rd)*
- **at** → clock times *(at 8:30)* · always **at night** (exception)
- **at Christmas** = whole holiday period · **on Christmas Day** = Dec 25 only

### Since *(May 19)*
- [→ Go to class](/?class=kyle_20260519)
- + a moment in time → always needs a **perfect tense** *(have / had)*
- *I've known him since 2010* · *I haven't seen him since then*
- *Since 16 years ago* = *for 16 years* (both correct)
- **Since** = *ya que* (causal) → *Since it's raining, let's stay home*
- **ever since** → desde entonces *(emphasis)*

### Ago / For / During / From…to *(May 19)*
- [→ Go to class](/?class=kyle_20260519)
- **ago** + simple past → completed action: *five minutes ago · an hour and a half ago*
- **for** + period → duration: *for three years · for an hour*
- **during** + noun/event → inside a period: *during the movie · during the party*
- **from…to** → closed, completed period *(Obama was president from 2009 to 2017)*
- Still inside the period? Use **since** → *Trump has been president since 2025*

### While / Before / After *(May 19)*
- [→ Go to class](/?class=kyle_20260519)
- **while** + subject + verb *(while I was in class, she called)*
- **before/after** + noun / gerund / full clause (3 options, all correct)
- **meanwhile** → two things happening at the same time
- **in the meantime** → while you wait, between now and then

## Phrasal Verbs

### Get + Vehicles *(May 12)*
- [→ Go to class](/?class=kyle_20260512)
- **get into / get out of** → cars, taxis, enclosed spaces
- **get on / get off** → buses, planes, trains, large vehicles

### Blow / Fire *(May 12)*
- [→ Go to class](/?class=kyle_20260512)
- **go off** → bomb explodes *(la bomba estalló)*
- **blow up** → building explodes *(el edificio voló)*
- **blow out** → candle *(apagar soplando)*
- **put out** → fire *(apagar un incendio)*

### Think *(May 12)*
- [→ Go to class](/?class=kyle_20260512)
- **think about** → having something in mind, no invention *(I was thinking about you)*
- **think of** → idea appeared *(I thought of a solution while washing the dishes)*
- **think up** → pure invention / creativity *(We need to think up a new plan)*

### Pick Up / Drop Off *(reference)*
- **Separable** phrasal verbs — object can split them
- Pronoun **must** go between verb and preposition
- ✓ *She picks him up* · ✗ ~~She picks up him~~

### Chance Encounters & Movement *(Jun 2)*
- [→ Go to class](/?class=kyle_20260602)
- **run into / bump into** → tropezar con alguien (people, by chance)
- **come across** → encontrar algo (things, by chance) ≠ *run into* (not for people)
- **catch up with** → alcanzar desde atrás / ponerse al día *(I caught up with her at the corner)*
- **run after** → ir corriendo detrás de alguien *(I ran after her)*
- **run out of** → quedarse sin algo *(We ran out of gasoline)*

### Break In / Put Up With *(Jun 9)*
- [→ Go to class](/?class=kyle_20260609)
- **to break something in** → estrenar algo poco a poco, acostumbrarlo al uso *(break in shoes, a glove, a horse)*
- **to put up with** → aguantar, soportar → *I'm fed up with putting up with my brother*
- *To break in a horse* = domarlo (get it accustomed to being ridden)

### Other Key Phrasal Verbs
- **on the way** → de camino *(I'm on my way)*
- **in the way** → obstruyendo *(There's a car in the way)*
- **out of the way** → quítate de en medio
- **take after** → character/behaviour resemblance, family only *(May 26)*
- **look like** → physical resemblance *(May 26)*

### Way — Direction & Manner *(May 26)*
- [→ Go to class](/?class=kyle_20260526)
- **which way?** → ¿en qué dirección? — use *which* for limited visible options
- **that way / this way** → manner / method: *I wouldn't do it that way*
- *The way things stand* → tal y como están las cosas
- *A lot of people have tried different **ways** of learning English*

### Take Over for Someone *(May 21)*
- [→ Go to class](/?class=kyle_20260521)
- **take over for** → relevar a alguien (work shift / task)
- *Let me take over for you* *(Déjame que te releve)*

### Catch up on / Catch up with *(Jun 11)*
- [→ Go to class](/?class=kyle_20260611)
- **catch up with** + person → alcanzar a alguien *(physically or figuratively)*
  - *Since they left an hour ago, I don't think you can catch up with them*
- **catch up on** + thing → ponerse al día en algo
  - *I need to catch up on my reading / on my French*

### Look Down On / Look Up To *(Jun 16)*
- [→ Go to class](/?class=kyle_20260616)
- **look down on** someone → despreciar / no tener en alta estima *(preposition: on)*
  - *She always feels that people are looking down on her*
- **look up to** someone → admirar / respetar como modelo *(preposition: to)*
  - *I look up to my parents · Who do you look up to?*
- Not true opposites: *look down on* = active disrespect; *look up to* = admiration of a specific person

## Interrogative Challenge

### Mastering the Interrogative *(May 14, 28 & Jun 16)*
- [→ Go to class](/?class=kyle_20260514)
- [→ Go to class](/?class=kyle_20260528)
- [→ Go to class](/?class=kyle_20260616)
- Structure: **question word + auxiliary + subject + verb**
- **whose** + noun directly → *Whose book is this?* ✓ · ~~Whose is this book?~~ ✗
- *Nobody* → ask with negative: *Why didn't **anyone** speak to him?*
- **in effect / in force** → the law / rule is currently active
- Passive sentences → question word + passive auxiliary: *When **was** this monastery built?*
- Stranded prepositions → keep at end: *When will she be operated **on**?* · *What can you trust him **for**?*

#### Jun 16 interrogative examples
- *We had to wait 30 minutes* → **How long** did we have to wait?
- *It was Morgan's fault* → **Whose** fault was it?
- *This monastery was built in the 12th century* → **When** was this monastery built?
- *The company was founded in 1967* → **When** was the company founded?
- *She will be operated on next month* → **When** will she be operated on?
- *He did it last week* → **When** did he do it?
- *The report is 24 pages long* → **How long** is the report?

## Describing People

### Describing Appearance *(May 5)*
- [→ Go to class](/?class=kyle_20260505)
- **What does he look like?** → physical, permanent, factual
  - Answer with **be** or **have**: *He's tall and has gray hair*
  - ✗ ~~He looks like tall~~
- **How does he look?** → physical, temporary / invites opinion
  - *He looked tired and pale*

### Describing Personality *(May 5)*
- [→ Go to class](/?class=kyle_20260505)
- **What is he like?** → permanent character traits
  - *She's hardworking, funny, and very generous*
- **How is he?** → current mood, temporary state
  - *He's much more relaxed than he used to be*

## Formal English & Business

### Business Complaint Letter *(May 12)*
- [→ Go to class](/?class=kyle_20260512)
- *To whom it may concern* ← formal opening (*whom* = object form, used almost nowhere else)
- *I am writing because I have suffered personal injury…*
- *take for granted* → dar por sentado
- *make up for* → compensar — *What do you intend to do to make up for this?*
- *as if it had been savagely attacked* → past perfect after *as if*
- *the offending blade* → el objeto culpable (for objects, not people)
- **enclosed** *(photos inside envelope)* vs **attached** *(PDF file in email)*
- **customer** *(buys a product)* vs **client** *(buys a service)*
- **try** *(intentar)* vs **try out** *(probar algo nuevo)*
- **defective / faulty** → defectuoso · **scratches** → arañazos · **loyal / faithful** → fiel
- *over 30 years* → more natural than "more than 30 years" *(over + number)*
- **"Will can" does not exist** → use **will be able to**: *You'll be able to imagine my anger*

### Business Vocabulary *(May 14)*
- [→ Go to class](/?class=kyle_20260514)
- **speculate** → forming opinions without firm evidence; also *invertir en bolsa*
  - Pronunciation: unvoiced S — say **speculate**, not ~~a-speculate~~
- **forecast** → prever *(verb and noun: a weather forecast = el pronóstico del tiempo)*
- **merge / merger** → fusionarse / la fusión de empresas
- **industry** → more natural than *sector* in everyday English
- **layoffs** → despidos masivos *(massive layoffs)*

### Business Vocabulary *(Jun 16)*
- [→ Go to class](/?class=kyle_20260616)
- **to lack** *(faltar)* → *I lack the right information · This food lacks salt*
- **performance** → rendimiento / resultados *(daily sales performance)*
- **to purchase** → more formal than *buy* *(You can purchase information from external suppliers)*
- **credit terms / payment terms** = facilidades de pago
- **to conduct a survey** = realizar una encuesta *(We've conducted a survey among secretaries)*
- **Supplier vs Provider:**
  - **supplier** → supplies physical products → to **customers**
  - **provider** → provides services → to **clients**
- **information** → uncountable — never *a good information* → say *good information*

### Responsibility Words *(May 26)*
- [→ Go to class](/?class=kyle_20260526)
- **blame** *(verb)* → *Don't blame me*
- **fault** *(noun)* → *It was Pepe's fault*
- **guilty** *(adjective)* → *He was found guilty*

## Vocabulary Themes

### Commonly Confused Words

#### Miss vs Lose *(May 28)*
- [→ Go to class](/?class=kyle_20260528)

// ── PART 1: Intercept Markmap.create to capture the instance ─────────────────
// markmap-autoloader@0.14 calls Markmap.create() on window.load.
// create() may return the instance directly (sync) or a Promise (async).
// We handle both so window.__mmInstance is always the real instance.
(function () {
  function onInstance(instance) {
    window.__mmInstance = instance;
    function fitWhenReady() {
      const svg = document.querySelector('svg.markmap');
      if (svg) {
        const r = svg.getBoundingClientRect();
        if (r.width > 100 && r.height > 100) { instance.fit(); return; }
      }
      requestAnimationFrame(fitWhenReady);
    }
    setTimeout(fitWhenReady, 300);
  }

  function tryWrap() {
    const M = window.markmap && window.markmap.Markmap;
    if (!M || !M.create || M.__wrapped) return false;
    const orig = M.create;
    M.create = function (...args) {
      const result = orig.apply(this, args);
      if (result && typeof result.then === 'function') {
        result.then(onInstance);  // async: Markmap.create() returns a Promise
      } else {
        onInstance(result);       // sync: result is the instance directly
      }
      return result;
    };
    M.__wrapped = true;
    return true;
  }
  if (!tryWrap()) {
    const t = setInterval(function () { if (tryWrap()) clearInterval(t); }, 5);
  }
})();

// ── PART 2: Search ───────────────────────────────────────────────────────────
(function () {
  const input   = document.getElementById('searchInput');
  const btnSearch = document.getElementById('btnSearch');
  const btnClear  = document.getElementById('btnClear');
  const countEl   = document.getElementById('searchCount');

  function clearHighlights() {
    document.querySelectorAll('g.markmap-node.search-match')
            .forEach(el => el.classList.remove('search-match'));
  }

  // Walk the INode data tree rooted at d (or d.data if d is a D3 HierarchyNode).
  // INode.children always contains ALL children regardless of fold state,
  // so this finds matches even inside collapsed branches not yet in the DOM.
  function subtreeHasMatch(d, q) {
    const node = (d && d.data !== undefined) ? d.data : d;
    if (!node) return false;
    const text = (node.content || '').replace(/<[^>]*>/g, '').toLowerCase();
    if (text.includes(q)) return true;
    return (node.children || []).some(c => subtreeHasMatch(c, q));
  }

  function highlightDOM(q) {
    const svg = document.querySelector('svg.markmap');
    if (!svg) return;
    let count = 0;
    svg.querySelectorAll('g.markmap-node').forEach(g => {
      if (g.textContent.toLowerCase().includes(q)) {
        g.classList.add('search-match');
        count++;
      }
    });
    countEl.textContent = count > 0 ? count + ' match' + (count !== 1 ? 'es' : '') : 'No matches';
    btnClear.style.display = 'inline-block';
  }

  function doSearch() {
    const q = input.value.trim().toLowerCase();
    clearHighlights();
    if (!q) { countEl.textContent = ''; btnClear.style.display = 'none'; return; }

    const svg = document.querySelector('svg.markmap');
    if (!svg) { highlightDOM(q); return; }

    // Each round: click the <circle> inside every collapsed node whose data
    // subtree contains q. The circle is markmap's actual fold-toggle target.
    // Repeat because expanding one level reveals newly visible collapsed nodes.
    function expandRound(round) {
      let expanded = false;
      svg.querySelectorAll('g.markmap-node').forEach(g => {
        const d = g.__data__;
        const folded = g.classList.contains('markmap-fold') ||
          !!(d && ((d.payload && d.payload.fold) ||
                   (d.data && d.data.payload && d.data.payload.fold)));
        if (folded && subtreeHasMatch(d, q)) {
          const circle = g.querySelector('circle');
          if (circle) circle.dispatchEvent(new MouseEvent('click', { bubbles: false }));
          expanded = true;
        }
      });
      if (!expanded || round > 6) { highlightDOM(q); return; }
      setTimeout(() => expandRound(round + 1), 400);
    }
    expandRound(0);
  }

  function doClear() {
    input.value = '';
    clearHighlights();
    countEl.textContent = '';
    btnClear.style.display = 'none';
    input.focus();
  }

  document.getElementById('btnReset').addEventListener('click', () => location.reload());
  btnSearch.addEventListener('click', doSearch);
  btnClear.addEventListener('click', doClear);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
    if (e.key === 'Escape') doClear();
  });
})();

// ── PART 3: Streamlit iframe auto-resize ─────────────────────────────────────
(function () {
  function reportHeight() {
    try {
      var ph = (window.parent !== window ? window.parent.innerHeight : window.innerHeight) || 700;
      var h = Math.max(400, ph - 160);
      window.parent.postMessage(
        { isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: h },
        '*'
      );
    } catch (e) {}
  }
  reportHeight();
  window.addEventListener('resize', function () {
    reportHeight();
    if (window.__mmInstance) window.__mmInstance.fit();
  });
})();
